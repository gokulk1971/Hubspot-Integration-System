name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      HUBSPOT_CLIENT_ID: test-hubspot-client
      HUBSPOT_CLIENT_SECRET: test-hubspot-secret
      NOTION_CLIENT_ID: test-notion-client
      NOTION_CLIENT_SECRET: test-notion-secret
      AIRTABLE_CLIENT_ID: test-airtable-client
      AIRTABLE_CLIENT_SECRET: test-airtable-secret
      BACKEND_URL: http://localhost:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t vectorshift-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t vectorshift-frontend ./frontend